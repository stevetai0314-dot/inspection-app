<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>異常回報 / Báo Lỗi</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        :root {
            --bg:#f0f4f8; --surf:#fff; --surf2:#f8fafc; --border:#dde3ea;
            --text:#1e293b; --muted:#64748b; --blue:#2563eb; --blue-lt:#eff6ff;
            --green-lt:#dcfce7; --green-dk:#15803d;
            --red:#dc2626; --red-lt:#fef2f2;
            --orange:#ea580c; --orange-lt:#fff7ed; --orange-bd:#fed7aa;
            --r:12px;
        }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

        /* Header */
        .app-header {
            background:#fff; padding:12px 20px; position:sticky; top:0; z-index:100;
            border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
            box-shadow:0 1px 4px rgba(0,0,0,.07);
        }
        .hd-title { font-size:13px; color:var(--red); letter-spacing:2px; font-weight:800; }
        .hd-sub   { font-size:10px; color:var(--muted); margin-top:2px; }
        .hd-right { display:flex; align-items:center; gap:8px; }
        .lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:20px; overflow:hidden; background:var(--surf2); }
        .lang-btn { background:none; border:none; color:var(--muted); font-size:11px; font-weight:700; padding:5px 12px; cursor:pointer; }
        .lang-btn.on { background:var(--blue); color:#fff; }
        .upload-badge { display:none; align-items:center; gap:4px; background:var(--orange); border:none; border-radius:20px; color:#fff; font-size:11px; font-weight:700; padding:5px 10px; cursor:pointer; white-space:nowrap; }
        .gear-btn { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; }

        /* Screens */
        .screen { display:none; } .screen.active { display:block; }

        /* Settings */
        .set-body { padding:20px; max-width:480px; margin:0 auto; }
        .set-desc { font-size:13px; color:var(--muted); margin-bottom:22px; line-height:1.7; }
        .set-group { margin-bottom:16px; }
        .set-lbl { font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; font-weight:700; }
        .set-inp { width:100%; background:var(--surf); border:2px solid var(--border); border-radius:10px; color:var(--text); font-size:15px; padding:12px 14px; outline:none; }
        .set-inp:focus { border-color:var(--blue); }
        .btn-save { width:100%; background:var(--blue); border:none; border-radius:var(--r); color:#fff; font-size:16px; padding:16px; cursor:pointer; font-weight:700; margin-top:8px; }

        /* Machine input screen */
        .mi-wrap {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            min-height:calc(100vh - 53px); gap:12px; padding:40px 20px;
        }
        .mi-lbl { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
        .mi-inp {
            width:100%; max-width:280px; height:90px; font-size:52px; font-weight:800;
            text-align:center; border:3px solid var(--border); border-radius:var(--r);
            background:var(--surf); color:var(--text); outline:none; transition:border-color .15s;
        }
        .mi-inp:focus { border-color:var(--orange); box-shadow:0 0 0 4px rgba(234,88,12,.1); }
        .mi-hint { font-size:12px; color:var(--muted); }
        .mi-yest {
            font-size:13px; color:var(--orange); font-weight:700;
            background:var(--orange-lt); border:1px solid var(--orange-bd);
            border-radius:8px; padding:6px 16px; display:none;
        }
        .mi-who { font-size:12px; color:var(--muted); margin-top:8px; }

        /* Form top bar */
        .form-top {
            background:#fff; position:sticky; top:52px; z-index:90;
            border-bottom:1px solid var(--border); padding:10px 20px;
            display:flex; align-items:center; gap:14px;
            box-shadow:0 1px 4px rgba(0,0,0,.05);
        }
        .form-back-btn { background:none; border:none; color:var(--blue); font-size:14px; font-weight:700; cursor:pointer; flex-shrink:0; }
        .form-mach-tag { font-size:22px; font-weight:800; color:var(--text); }
        .form-yest-tag { font-size:11px; color:var(--orange); font-weight:700; background:var(--orange-lt); border:1px solid var(--orange-bd); border-radius:6px; padding:3px 8px; white-space:nowrap; }
        .form-kbd-hint { margin-left:auto; font-size:11px; color:var(--muted); }

        /* Desktop form */
        .dk-wrap { max-width:760px; margin:0 auto; padding:16px 20px 100px; }

        .dk-section { margin-bottom:8px; border:1.5px solid var(--border); border-radius:var(--r); background:var(--surf); overflow:hidden; }

        .dk-sec-hd {
            padding:13px 18px; font-size:12px; font-weight:800; color:var(--muted);
            letter-spacing:2px; text-transform:uppercase; cursor:pointer;
            display:flex; align-items:center; gap:10px; outline:none;
            user-select:none; transition:background .1s;
        }
        .dk-sec-hd:hover  { background:var(--surf2); }
        .dk-sec-hd:focus  { background:var(--blue-lt); color:var(--blue); outline:2px solid var(--blue); outline-offset:-2px; }
        .dk-hint { margin-left:auto; font-size:10px; font-weight:400; color:var(--blue); letter-spacing:0; text-transform:none; opacity:0; transition:opacity .15s; white-space:nowrap; }
        .dk-sec-hd:focus .dk-hint { opacity:1; }

        .dk-sec-body { padding:16px 18px 18px; border-top:1.5px solid var(--border); }

        .dk-inp {
            width:100%; height:52px; background:var(--surf2); border:2px solid var(--border);
            border-radius:10px; color:var(--text); font-size:22px; font-weight:600;
            padding:0 10px; text-align:center; outline:none; transition:border-color .15s, background .15s;
        }
        .dk-inp:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(234,88,12,.1); background:#fff; }
        .dk-inp.filled { background:var(--orange-lt); border-color:var(--orange); color:var(--orange); }

        .rong-grid { display:grid; grid-template-columns:28px 1fr 28px 1fr; align-items:center; gap:10px 14px; }
        .rong-grid label { font-size:13px; font-weight:700; color:var(--muted); text-align:center; }

        .trio-block { margin-bottom:14px; }
        .trio-block:last-child { margin-bottom:0; }
        .side-lbl { font-size:11px; font-weight:700; color:var(--text); letter-spacing:.5px; margin-bottom:8px; }
        .trio-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
        .trio-cell { display:flex; flex-direction:column; gap:5px; }
        .trio-lbl { font-size:10px; color:var(--muted); text-align:center; }
        .divider { border:none; border-top:1px solid var(--border); margin:14px 0; }

        .ap-side { margin-bottom:14px; }
        .ap-side:last-child { margin-bottom:0; }
        .defect-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .d-chip { background:var(--surf2); border:1.5px solid var(--border); border-radius:8px; color:var(--muted); font-size:11px; padding:6px 10px; cursor:pointer; line-height:1.35; transition:all .1s; }
        .d-chip strong { display:block; font-size:12px; color:#475569; }
        .d-chip:focus { outline:2px solid var(--blue); outline-offset:1px; }
        .d-chip.on { background:var(--red-lt); border-color:var(--red); color:#b91c1c; }
        .d-chip.on strong { color:var(--red); }
        .other-inp { width:100%; background:var(--surf2); border:2px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; padding:10px 14px; outline:none; margin-top:8px; display:none; }
        .other-inp:focus { border-color:var(--orange); }

        .yest-ref { background:var(--orange-lt); border:1.5px solid var(--orange-bd); border-radius:10px; padding:10px 14px; margin:12px 20px 0; max-width:760px; margin-left:auto; margin-right:auto; }
        .yest-ref-ttl { font-size:10px; color:var(--orange); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
        .yest-row { display:flex; align-items:baseline; gap:6px; font-size:12px; margin-bottom:4px; flex-wrap:wrap; }
        .yest-row:last-child { margin-bottom:0; }
        .yest-type { font-weight:800; color:var(--orange); min-width:34px; }
        .yest-side { color:var(--muted); font-size:11px; }
        .yest-val  { color:var(--text); font-weight:600; margin-right:8px; }

        .dk-sub { margin-top:12px; }
        .btn-sub { width:100%; background:var(--red); border:none; border-radius:var(--r); color:#fff; font-size:17px; font-weight:800; padding:17px; cursor:pointer; letter-spacing:1px; box-shadow:0 3px 10px rgba(220,38,38,.35); }
        .btn-sub:focus { outline:3px solid var(--red); outline-offset:2px; }
        .btn-sub:disabled { opacity:.5; box-shadow:none; }
        .btn-rst { width:100%; background:#fff; border:1.5px solid var(--border); border-radius:var(--r); color:var(--muted); font-size:14px; padding:12px; cursor:pointer; margin-top:8px; }

        /* Success */
        .ok-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 53px); gap:14px; text-align:center; padding:24px; }
        .ok-icon { font-size:64px; }
        .ok-msg  { font-size:22px; color:var(--green-dk); font-weight:800; }
        .ok-tag  { font-size:12px; font-weight:700; padding:5px 14px; border-radius:20px; }
        .ok-tag.uploaded { background:var(--green-lt); color:var(--green-dk); }
        .ok-tag.pending  { background:var(--orange-lt); color:var(--orange); border:1px solid var(--orange-bd); }
        .ok-det  { font-size:13px; color:var(--muted); line-height:1.8; }
        .btn-next { background:var(--blue); border:none; border-radius:var(--r); color:#fff; font-size:16px; padding:14px 36px; cursor:pointer; font-weight:700; margin-top:4px; }
        .btn-next:focus { outline:3px solid var(--blue); outline-offset:2px; }

        /* Toast */
        .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--red); color:#fff; padding:10px 22px; border-radius:30px; font-size:13px; transition:transform .3s; z-index:999; pointer-events:none; white-space:nowrap; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.ok { background:var(--green-dk); }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="app-header">
    <div>
        <div class="hd-title">⚠ <span data-zh="異常回報" data-vi="BÁO LỖI MÁY">異常回報</span></div>
        <div class="hd-sub">Q0-QR-006 ＋ Q0-QR-017</div>
    </div>
    <div class="hd-right">
        <button class="upload-badge" id="uploadBadge" onclick="uploadQueue()"></button>
        <div class="lang-toggle">
            <button class="lang-btn on" id="lbtn_zh" onclick="switchLang('zh')">中</button>
            <button class="lang-btn"    id="lbtn_vi" onclick="switchLang('vi')">VI</button>
        </div>
        <button class="gear-btn" onclick="goSettings()">⚙️</button>
    </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="scrSettings">
    <div class="set-body">
        <p class="set-desc" data-zh="設定一次，之後不需要重填。" data-vi="Thiết lập một lần, không cần nhập lại.">設定一次，之後不需要重填。</p>
        <div class="set-group">
            <div class="set-lbl" data-zh="巡檢人員" data-vi="Tên người kiểm">巡檢人員</div>
            <input class="set-inp" type="text" id="cfgName" placeholder="STEVE">
        </div>
        <button class="btn-save" onclick="saveSettings()" data-zh="儲存並開始 →" data-vi="LƯU VÀ BẮT ĐẦU →">儲存並開始 →</button>
    </div>
</div>

<!-- MACHINE INPUT -->
<div class="screen" id="scrMachine">
    <div class="mi-wrap">
        <div class="mi-lbl" data-zh="輸入機台號" data-vi="Nhập số máy">輸入機台號</div>
        <input class="mi-inp" id="machNoInp" type="text" inputmode="numeric"
               autocomplete="off" autocorrect="off" spellcheck="false" placeholder="—">
        <div class="mi-yest" id="miYest"></div>
        <div class="mi-hint" data-zh="Enter 確認" data-vi="Enter để xác nhận">Enter 確認</div>
        <div class="mi-who" id="miWho"></div>
    </div>
</div>

<!-- FORM -->
<div class="screen" id="scrMain">
    <div class="form-top">
        <button class="form-back-btn" onclick="goMachineInput()">←</button>
        <span class="form-mach-tag" id="formMachTag"></span>
        <span class="form-yest-tag" id="formYestTag" style="display:none"></span>
        <span class="form-kbd-hint" data-zh="Tab 略過類別　Enter 跳欄　送出後自動回機台號" data-vi="Tab bỏ qua　Enter nhảy ô">Tab 略過類別　Enter 跳欄　送出後自動回機台號</span>
    </div>

    <div class="yest-ref" id="yesterdayRef" style="display:none"></div>

    <div class="dk-wrap">

        <!-- 帶寬 -->
        <div class="dk-section">
            <div class="dk-sec-hd" tabindex="0" data-sec="rong">
                <span data-zh="帶寬" data-vi="Độ rộng">帶寬</span>
                <span class="dk-hint" data-zh="Enter 填入　Tab 略過" data-vi="Enter điền　Tab bỏ qua">Enter 填入　Tab 略過</span>
            </div>
            <div class="dk-sec-body" id="sec_rong">
                <div class="rong-grid">
                    <label data-zh="左" data-vi="Trái">左</label>
                    <input class="dk-inp" id="rong_t" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)">
                    <label data-zh="右" data-vi="Phải">右</label>
                    <input class="dk-inp" id="rong_p" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)">
                </div>
            </div>
        </div>

        <!-- 勾高 -->
        <div class="dk-section">
            <div class="dk-sec-hd" tabindex="0" data-sec="cao">
                <span data-zh="勾高" data-vi="Cao móc">勾高</span>
                <span class="dk-hint" data-zh="Enter 填入　Tab 略過" data-vi="Enter điền　Tab bỏ qua">Enter 填入　Tab 略過</span>
            </div>
            <div class="dk-sec-body" id="sec_cao">
                <div class="trio-block">
                    <div class="side-lbl" data-zh="左側" data-vi="Bên trái">左側</div>
                    <div class="trio-grid">
                        <div class="trio-cell"><span class="trio-lbl" data-zh="邊界側" data-vi="Bên kiếm">邊界側</span><input class="dk-inp" id="cao_tk" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="中間"   data-vi="Giữa">中間</span>    <input class="dk-inp" id="cao_tg" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="針側"   data-vi="Bên kim">針側</span>  <input class="dk-inp" id="cao_tm" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                    </div>
                </div>
                <hr class="divider">
                <div class="trio-block">
                    <div class="side-lbl" data-zh="右側" data-vi="Bên phải">右側</div>
                    <div class="trio-grid">
                        <div class="trio-cell"><span class="trio-lbl" data-zh="邊界側" data-vi="Bên kiếm">邊界側</span><input class="dk-inp" id="cao_pk" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="中間"   data-vi="Giữa">中間</span>    <input class="dk-inp" id="cao_pg" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="針側"   data-vi="Bên kim">針側</span>  <input class="dk-inp" id="cao_pm" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 電熱 -->
        <div class="dk-section">
            <div class="dk-sec-hd" tabindex="0" data-sec="nhiet">
                <span data-zh="電熱" data-vi="Nhiệt">電熱</span>
                <span class="dk-hint" data-zh="Enter 填入　Tab 略過" data-vi="Enter điền　Tab bỏ qua">Enter 填入　Tab 略過</span>
            </div>
            <div class="dk-sec-body" id="sec_nhiet">
                <div class="trio-block">
                    <div class="side-lbl" data-zh="左側" data-vi="Bên trái">左側</div>
                    <div class="trio-grid">
                        <div class="trio-cell"><span class="trio-lbl" data-zh="邊界側" data-vi="Bên kiếm">邊界側</span><input class="dk-inp" id="nhiet_tk" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="中間"   data-vi="Giữa">中間</span>    <input class="dk-inp" id="nhiet_tg" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="針側"   data-vi="Bên kim">針側</span>  <input class="dk-inp" id="nhiet_tm" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                    </div>
                </div>
                <hr class="divider">
                <div class="trio-block">
                    <div class="side-lbl" data-zh="右側" data-vi="Bên phải">右側</div>
                    <div class="trio-grid">
                        <div class="trio-cell"><span class="trio-lbl" data-zh="邊界側" data-vi="Bên kiếm">邊界側</span><input class="dk-inp" id="nhiet_pk" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="中間"   data-vi="Giữa">中間</span>    <input class="dk-inp" id="nhiet_pg" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                        <div class="trio-cell"><span class="trio-lbl" data-zh="針側"   data-vi="Bên kim">針側</span>  <input class="dk-inp" id="nhiet_pm" type="text" inputmode="decimal" autocomplete="off" oninput="onFill(this)"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 外觀 -->
        <div class="dk-section">
            <div class="dk-sec-hd" tabindex="0" data-sec="ngoai">
                <span data-zh="外觀" data-vi="Ngoại quan">外觀</span>
                <span class="dk-hint" data-zh="Enter 填入　Tab 略過" data-vi="Enter điền　Tab bỏ qua">Enter 填入　Tab 略過</span>
            </div>
            <div class="dk-sec-body" id="sec_ngoai">
                <div class="ap-side">
                    <div class="side-lbl" data-zh="左側" data-vi="Bên trái">左側</div>
                    <div class="defect-grid" id="grid_t"></div>
                    <input class="other-inp" id="oi_t" data-ph-zh="其他說明..." data-ph-vi="Khác..." placeholder="其他說明...">
                </div>
                <hr class="divider">
                <div class="ap-side">
                    <div class="side-lbl" data-zh="右側" data-vi="Bên phải">右側</div>
                    <div class="defect-grid" id="grid_p"></div>
                    <input class="other-inp" id="oi_p" data-ph-zh="其他說明..." data-ph-vi="Khác..." placeholder="其他說明...">
                </div>
            </div>
        </div>

        <div class="dk-sub">
            <button class="btn-sub" id="btnSub" onclick="submitForm()"
                    data-zh="⚠ 送出異常回報" data-vi="⚠ GỬI BÁO LỖI">⚠ 送出異常回報</button>
            <button class="btn-rst" onclick="resetForm()"
                    data-zh="↺ 清除重填" data-vi="↺ Làm mới">↺ 清除重填</button>
        </div>
    </div>
</div>

<!-- SUCCESS -->
<div class="screen" id="scrOK">
    <div class="ok-wrap">
        <div class="ok-icon" id="okIcon">✅</div>
        <div class="ok-msg" id="okMsg">回報成功</div>
        <div class="ok-tag" id="okTag"></div>
        <div class="ok-det" id="okDet"></div>
        <button class="btn-next" id="btnNext" onclick="goMachineInput()"
                data-zh="下一台 →" data-vi="Máy tiếp →">下一台 →</button>
    </div>
</div>

<script>
var DEFECTS = [
    ["D02","污緯紗","Chỉ ngang dơ"],
    ["D06","沾污","Đai dơ"],
    ["Y02","斷緯紗","Đứt sợi chỉ ngang"],
    ["Y06","浮經紗","Nổi chỉ nền"],
    ["Y07","浮毛紗","Nổi chỉ bông"],
    ["Y10","錯穿經紗","Xỏ sai"],
    ["Y17","邊毛","Nổi lông biên"],
    ["Y18","邊漏織","Lỗi sợi biên"],
    ["S01","兩面直條","Đường thẳng 2 mặt"],
    ["S02","帶面直條","Đường thẳng mặt trước"],
    ["S03","帶背直條","Đường thẳng mặt sau"],
    ["S09","荷葉邊","Viền lá sen"],
    ["S10","彎帶","Đai cong"],
    ["S11","拱帶","Đai vênh"],
    ["S25","孔洞直條","Lỗ kim to (khung go)"],
    ["S29","邊粗糙","Biên thô"],
    ["S45","邊圈狀","Biên nổi vòng tròn"],
    ["S46","收邊不漂亮","Dệt biên không đẹp"],
    ["H01","邊倒勾","Móc biên ngã"],
    ["H02","邊勾型不良","Hình móc không đạt"],
    ["H04","勾大或圓","Móc to hoặc tròn"],
    ["H05","勾小或尖","Móc nhỏ hoặc nhọn"],
    ["W06","邊縫寬","Biên đai rộng"],
    ["W08","邊縫窄","Biên đai hẹp"],
    ["M08","勾嚴重毛邊","Cắt móc trắng đầu"]
];

var GAS_URL = "https://script.google.com/macros/s/AKfycbzbFxPaHZJI-ehCHXC__gFLDUzkI15GJUORRPbuOyTy4LslzTQc_C58jDKB-5hQy2ss/exec";
var K = {name:"cfg_name", lang:"cfg_lang"};
var QUEUE_KEY = "pending_queue";
var defects = {t:new Set(), p:new Set()};
var currentLang = "zh";
var selectedMachine = null;
var yesterdayAlerts = {};
var TYPE_MAP = {"帶寬":"Độ rộng","勾高":"Cao móc","電熱":"Nhiệt","外觀":"Ngoại quan"};

// ── Offline Queue ──
function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");}catch(e){return[];}}
function saveQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}
function enqueue(p){var q=getQueue();q.push(p);saveQueue(q);updateBadge();}
function dequeue(id){saveQueue(getQueue().filter(function(p){return p._id!==id;}));updateBadge();}
function updateBadge(){
    var n=getQueue().length,el=document.getElementById("uploadBadge");
    if(n>0){el.textContent="⏳ "+n;el.style.display="flex";}else el.style.display="none";
}
async function uploadOne(p){
    await fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
    dequeue(p._id);
}
async function uploadQueue(){
    var q=getQueue();if(!q.length)return;
    document.getElementById("uploadBadge").textContent=currentLang==="zh"?"上傳中...":"Đang tải...";
    var failed=0;
    for(var i=0;i<q.length;i++){try{await uploadOne(q[i]);}catch(e){failed++;}}
    updateBadge();
    showToast(failed===0?(currentLang==="zh"?"全部上傳完成 ✓":"Đã tải lên xong ✓"):(failed+(currentLang==="zh"?" 筆失敗":" lỗi")),failed===0);
}
window.addEventListener("online",function(){if(getQueue().length>0)uploadQueue();});

// ── Alerts ──
function fetchAlerts(){
    return new Promise(function(resolve){
        var cb="_cb"+Date.now(),done=false;
        var finish=function(data){if(done)return;done=true;yesterdayAlerts=data||{};delete window[cb];var s=document.getElementById(cb);if(s)s.parentNode.removeChild(s);resolve();};
        window[cb]=finish;
        var script=document.createElement("script");
        script.id=cb;script.src=GAS_URL+"?callback="+cb;
        script.onerror=function(){finish({});};
        setTimeout(function(){finish({});},8000);
        document.head.appendChild(script);
    });
}

// ── Machine input screen ──
function goMachineInput(){
    goScreen("scrMachine");
    var inp=document.getElementById("machNoInp");
    inp.value="";
    document.getElementById("miYest").style.display="none";
    setTimeout(function(){inp.focus();},80);
}
function initMachInput(){
    var inp=document.getElementById("machNoInp");
    inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"){e.preventDefault();goFormByInput();}
    });
    inp.addEventListener("input",function(){
        var mNo=inp.value.trim();
        var el=document.getElementById("miYest");
        if(mNo&&yesterdayAlerts[mNo]&&Object.keys(yesterdayAlerts[mNo]).length>0){
            var types=Object.keys(yesterdayAlerts[mNo]);
            var zh=currentLang==="zh";
            el.textContent="⚠ "+(zh?"昨日有異常：":"Hôm qua có lỗi: ")+types.map(function(t){return zh?t:(TYPE_MAP[t]||t);}).join("、");
            el.style.display="block";
        }else{
            el.style.display="none";
        }
    });
}
function goFormByInput(){
    var mNo=document.getElementById("machNoInp").value.trim();
    if(!mNo){showToast(currentLang==="zh"?"請輸入機台號":"Nhập số máy");return;}
    selectedMachine=mNo;
    goForm(mNo);
}

// ── Form ──
function goForm(mNo){
    resetForm();
    var zh=currentLang==="zh";
    document.getElementById("formMachTag").textContent="#"+mNo;
    var alerts=yesterdayAlerts[String(mNo)];
    var tag=document.getElementById("formYestTag"),ref=document.getElementById("yesterdayRef");
    if(alerts&&Object.keys(alerts).length>0){
        var types=Object.keys(alerts);
        tag.textContent=(zh?"⚠ 昨日：":"⚠ Hôm qua: ")+types.map(function(t){return zh?t:(TYPE_MAP[t]||t);}).join("、");
        tag.style.display="";
        var html='<div class="yest-ref-ttl">'+(zh?"⚠ 昨日數值":"⚠ Giá trị hôm qua")+'</div>';
        types.forEach(function(type){
            var vals=alerts[type],lbl=zh?type:(TYPE_MAP[type]||type);
            var lL=zh?"左":"T",rL=zh?"右":"P";
            html+='<div class="yest-row"><span class="yest-type">'+lbl+'</span>'
                 +'<span class="yest-side">'+lL+'</span><span class="yest-val">'+(vals[0]||"-")+'</span>'
                 +'<span class="yest-side">'+rL+'</span><span class="yest-val">'+(vals[1]||"-")+'</span></div>';
        });
        ref.innerHTML=html;ref.style.display="";
    }else{tag.style.display="none";ref.style.display="none";}
    goScreen("scrMain");
    setTimeout(function(){document.querySelector(".dk-sec-hd").focus();},80);
}

// ── Section keyboard nav ──
function initSectionNav(){
    var secIds=["rong","cao","nhiet","ngoai"];
    var headers=secIds.map(function(s){return document.querySelector('[data-sec="'+s+'"]');});
    headers.forEach(function(hd,idx){
        hd.addEventListener("keydown",function(e){
            if(e.key==="Tab"&&!e.shiftKey){
                e.preventDefault();
                (headers[idx+1]||document.getElementById("btnSub")).focus();
            }else if(e.key==="Tab"&&e.shiftKey){
                e.preventDefault();
                if(headers[idx-1])headers[idx-1].focus();
            }else if(e.key==="Enter"||e.key===" "){
                e.preventDefault();
                var body=document.getElementById("sec_"+hd.getAttribute("data-sec"));
                var first=body.querySelector("input,.d-chip");
                if(first)first.focus();
            }
        });
    });
    // Enter in text inputs → next focusable element
    document.getElementById("scrMain").addEventListener("keydown",function(e){
        if(e.key!=="Enter")return;
        var t=e.target;
        if(t.tagName!=="INPUT"||t.classList.contains("other-inp"))return;
        e.preventDefault();
        var all=Array.from(document.querySelectorAll('#scrMain .dk-sec-hd,#scrMain input.dk-inp,#scrMain .d-chip,#btnSub'));
        var idx=all.indexOf(t);
        if(all[idx+1])all[idx+1].focus();
    });
}

// ── onFill ──
function onFill(el){el.classList.toggle("filled",!!el.value);}

// ── Defect grids ──
function buildGrids(){
    var idx=currentLang==="zh"?1:2;
    ["t","p"].forEach(function(side){
        var grid=document.getElementById("grid_"+side);
        DEFECTS.forEach(function(d){
            var c=document.createElement("button");
            c.className="d-chip";c.dataset.code=d[0];
            c.innerHTML="<strong>"+d[0]+"</strong>"+d[idx];
            (function(s,code,ch){c.onclick=function(){toggleDefect(s,code,ch);};})(side,d[0],c);
            grid.appendChild(c);
        });
        var oc=document.createElement("button");
        oc.className="d-chip";oc.dataset.code="OTHER";
        oc.innerHTML="<strong>"+(currentLang==="zh"?"其他":"Khác")+"</strong>";
        (function(s,ch){oc.onclick=function(){toggleOtherChip(s,ch);};})(side,oc);
        grid.appendChild(oc);
    });
}
function toggleDefect(side,code,chip){
    var s=defects[side];
    if(s.has(code)){s.delete(code);chip.classList.remove("on");}
    else{s.add(code);chip.classList.add("on");}
}
function toggleOtherChip(side,chip){
    var inp=document.getElementById("oi_"+side);
    var show=inp.style.display!=="block";
    inp.style.display=show?"block":"none";
    if(!show)inp.value="";
    chip.classList.toggle("on",show);
    if(show)inp.focus();
}

// ── hasData ──
function hasData(type){
    function v(id){return document.getElementById(id).value.trim();}
    if(type==="rong")  return !!(v("rong_t")||v("rong_p"));
    if(type==="cao")   return ["cao_tk","cao_tg","cao_tm","cao_pk","cao_pg","cao_pm"].some(function(id){return !!v(id);});
    if(type==="nhiet") return ["nhiet_tk","nhiet_tg","nhiet_tm","nhiet_pk","nhiet_pg","nhiet_pm"].some(function(id){return !!v(id);});
    if(type==="ngoai") return defects.t.size>0||defects.p.size>0||!!v("oi_t")||!!v("oi_p");
    return false;
}

// ── Collect ──
function getVal(id){return document.getElementById(id).value.trim()||"-";}
function getTrio(pre){return ["k","g","m"].map(function(s){return getVal(pre+s);}).join(" / ");}
function getAppearance(side){
    var other=document.getElementById("oi_"+side).value.trim();
    var parts=Array.from(defects[side]);
    if(other)parts.push((currentLang==="zh"?"其他":"Khác")+": "+other);
    return parts.join(", ");
}

// ── Submit ──
async function submitForm(){
    if(!["rong","cao","nhiet","ngoai"].some(hasData)){
        showToast(currentLang==="zh"?"請至少填寫一項異常":"Thêm ít nhất 1 lỗi");return;
    }
    var machine=String(selectedMachine);
    var payload={
        _id:             Date.now(),
        timestamp:       new Date().toLocaleString("zh-TW"),
        inspector:       localStorage.getItem(K.name)||"",
        so_may:          machine,
        do_rong_trai:    hasData("rong") ?getVal("rong_t")  :"",
        do_rong_phai:    hasData("rong") ?getVal("rong_p")  :"",
        cao_trai:        hasData("cao")  ?getTrio("cao_t")  :"",
        cao_phai:        hasData("cao")  ?getTrio("cao_p")  :"",
        nhiet_trai:      hasData("nhiet")?getTrio("nhiet_t"):"",
        nhiet_phai:      hasData("nhiet")?getTrio("nhiet_p"):"",
        ngoai_quan_trai: hasData("ngoai")?getAppearance("t"):"",
        ngoai_quan_phai: hasData("ngoai")?getAppearance("p"):""
    };
    enqueue(payload);
    var btn=document.getElementById("btnSub");
    btn.disabled=true;btn.textContent=currentLang==="zh"?"送出中...":"Đang gửi...";
    var labels={rong:["帶寬","Độ rộng"],cao:["勾高","Cao móc"],nhiet:["電熱","Nhiệt"],ngoai:["外觀","Ngoại quan"]};
    var li=currentLang==="zh"?0:1;
    var types=["rong","cao","nhiet","ngoai"].filter(hasData).map(function(t){return labels[t][li];}).join("、");
    document.getElementById("okDet").innerHTML=
        (currentLang==="zh"?"機台":"Máy")+" #"+machine+"　"+payload.timestamp+
        "<br>"+(currentLang==="zh"?"巡檢：":"Người kiểm: ")+payload.inspector+
        "<br>"+(currentLang==="zh"?"異常：":"Lỗi: ")+types;
    var uploaded=false;
    if(navigator.onLine){
        try{
            await fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
            dequeue(payload._id);uploaded=true;
        }catch(e){}
    }
    var tag=document.getElementById("okTag"),msg=document.getElementById("okMsg"),icon=document.getElementById("okIcon");
    if(uploaded){
        icon.textContent="✅";msg.textContent=currentLang==="zh"?"回報成功":"Đã gửi thành công";
        tag.className="ok-tag uploaded";tag.textContent=currentLang==="zh"?"✓ 已上傳":"✓ Đã tải lên";
    }else{
        icon.textContent="📱";msg.textContent=currentLang==="zh"?"已暫存本機":"Đã lưu tạm";
        tag.className="ok-tag pending";tag.textContent=currentLang==="zh"?"⏳ 有網路時自動上傳":"⏳ Sẽ tự động tải khi có mạng";
    }
    goScreen("scrOK");
    btn.disabled=false;btn.textContent=currentLang==="zh"?"⚠ 送出異常回報":"⚠ GỬI BÁO LỖI";
    // Auto focus "下一台" so pressing Enter immediately continues
    setTimeout(function(){document.getElementById("btnNext").focus();},100);
}

// ── Reset ──
function resetForm(){
    document.querySelectorAll("#scrMain .dk-inp,#scrMain .other-inp").forEach(function(el){
        el.value="";el.classList.remove("filled");
    });
    defects.t.clear();defects.p.clear();
    document.querySelectorAll(".d-chip").forEach(function(c){c.classList.remove("on");});
    document.querySelectorAll(".other-inp").forEach(function(el){el.style.display="none";el.value="";});
}

// ── Screen ──
function goScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
    document.getElementById(id).classList.add("active");
    window.scrollTo(0,0);
}

// ── Settings ──
function loadCfg(){document.getElementById("cfgName").value=localStorage.getItem(K.name)||"";}
function saveSettings(){
    var name=document.getElementById("cfgName").value.trim();
    if(!name){showToast(currentLang==="zh"?"請輸入名字":"Vui lòng nhập tên");return;}
    localStorage.setItem(K.name,name);
    goMachineInput();
    document.getElementById("miWho").textContent=(currentLang==="zh"?"巡檢人員：":"Người kiểm: ")+name;
    fetchAlerts();
}
function goSettings(){loadCfg();goScreen("scrSettings");}

// ── Toast ──
function showToast(msg,isOk){
    var t=document.getElementById("toast");
    t.textContent=msg;t.className="toast show"+(isOk?" ok":"");
    setTimeout(function(){t.classList.remove("show");},3000);
}

// ── Language ──
function switchLang(lang){
    currentLang=lang;localStorage.setItem(K.lang,lang);applyLang();
}
function applyLang(){
    var zh=currentLang==="zh";
    document.getElementById("lbtn_zh").classList.toggle("on",zh);
    document.getElementById("lbtn_vi").classList.toggle("on",!zh);
    document.querySelectorAll("[data-zh]").forEach(function(el){el.textContent=zh?el.dataset.zh:el.dataset.vi;});
    document.querySelectorAll("[data-ph-zh]").forEach(function(el){el.placeholder=zh?el.dataset.phZh:el.dataset.phVi;});
    var idx=zh?1:2;
    document.querySelectorAll(".d-chip").forEach(function(chip){
        var code=chip.dataset.code;
        if(code==="OTHER"){chip.innerHTML="<strong>"+(zh?"其他":"Khác")+"</strong>";return;}
        var d=DEFECTS.find(function(x){return x[0]===code;});
        if(d)chip.innerHTML="<strong>"+d[0]+"</strong>"+d[idx];
    });
    var name=localStorage.getItem(K.name)||"";
    if(name)document.getElementById("miWho").textContent=(zh?"巡檢人員：":"Người kiểm: ")+name;
}

// ── Init ──
window.onload=function(){
    currentLang=localStorage.getItem(K.lang)||"zh";
    buildGrids();
    applyLang();
    loadCfg();
    updateBadge();
    initSectionNav();
    initMachInput();
    var name=localStorage.getItem(K.name)||"";
    if(name){
        document.getElementById("miWho").textContent=(currentLang==="zh"?"巡檢人員：":"Người kiểm: ")+name;
        goMachineInput();
        fetchAlerts();
    }else{
        goScreen("scrSettings");
    }
};
</script>
